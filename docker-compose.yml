services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: standup
      POSTGRES_PASSWORD: standup
      POSTGRES_DB: standup
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U standup -d standup"]
      interval: 3s
      timeout: 3s
      retries: 20
    ports:
      - "5432:5432"

  api:
    build: ./backend
    command: >
      sh -c "alembic upgrade head &&
             python -m app.seed &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"
    environment:
      ENVIRONMENT: local
      DATABASE_URL: postgresql+psycopg://standup:standup@db:5432/standup
      AUTH_MODE: dev
      DEV_DEFAULT_USER_EMAIL: manager@nex.local
      CORS_ORIGINS: http://localhost:5173,http://localhost:8080
      AI_PROVIDER: mock
      AI_PROCESSING_INLINE: "true"
      TRANSCRIPT_LOCAL_DIR: /data/transcripts
    volumes:
      - transcripts:/data/transcripts
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  web:
    build: ./frontend
    depends_on:
      - api
    ports:
      - "8080:80"

volumes:
  pgdata:
  transcripts:
