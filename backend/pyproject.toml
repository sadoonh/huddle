[project]
name = "nex-standup-backend"
version = "0.1.0"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# The seed script intentionally builds a large graph of demo objects and keeps
# readable, descriptive local names even when a task variable is only used to
# create the row.
"app/seed.py" = ["F841", "E501"]
"tests/*" = ["E501"]
